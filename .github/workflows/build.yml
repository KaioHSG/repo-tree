name: Build & Tag Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag (e.g., v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm install
      - run: npm run build
      - name: Commit build artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add repo-tree.min.js highlight/
          git commit -m "build: regenerate repo-tree.min.js + highlights for ${{ github.event.inputs.tag }}" || true
          git push origin main || true
      - name: Tag & push
        run: |
          git tag ${{ github.event.inputs.tag }}
          git push origin ${{ github.event.inputs.tag }}
      - name: Bundle template
        run: |
          zip -r Repo-Tree-Template.zip template/*
      - name: Bundle highlights
        run: |
          zip -r Highlights.zip highlights/
      - uses: softprops/action-gh-release@v3
        with:
          name: "Repo Tree - ${{ github.event.inputs.tag }}"
          tag_name: ${{ github.event.inputs.tag }}
          files: |
            Highlights.zip
            Repo-Tree-Template.zip
            repo-tree.min.js