<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Lost in the Sketchbook</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="assets/imgs/noto-emoji/evergreen-tree.ico">
</head>
<body>

  <div id="site-header">
    <a href="." id="site-logo" title="Home">✏️ Architect’s Sketchbook</a>
    <span id="site-subtitle">
      <a href="https://kaiohsg.dev" class="subtitle-author">KaioHSG.Dev</a>
      <span class="subtitle-sep" aria-hidden="true">·</span>
      <a href="https://github.com/KaioHSG/repo-tree" class="subtitle-repo">KaioHSG/repo-tree</a>
    </span>
  </div>

  <div id="container" class="error-page">

    <div class="error-illustration" aria-hidden="true">
      <span class="error-digit">404</span>
    </div>

    <h1 class="error-title">Page not found</h1>

    <p class="error-message">
      Looks like this path leads somewhere that hasn't been drawn yet.<br>
      The sketchbook has <strong>404 pages</strong>, but this one is blank.
    </p>

    <div class="error-compass">
      <span class="compass-needle">↶</span>
      <a href="." class="error-back">Back to the sketchbook</a>
    </div>

  </div>

  <div id="site-footer">
    <span>Repo Tree · <a href="https://github.com/KaioHSG/repo-tree">source</a></span>
    <span id="footer-rule"></span>
  </div>

</body>
</html>
